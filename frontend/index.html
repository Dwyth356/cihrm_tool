<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>C.I.H.R.M. | Hotel Learning System</title>
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/theme.css" />
  </head>
  <body>
    <button
      type="button"
      id="themeToggle"
      class="theme-toggle"
      aria-label="Switch to dark mode"
      title="Switch to dark mode"
    >
      <span id="themeIcon" aria-hidden="true">☾</span>
      <span id="themeLabel">Dark mode</span>
    </button>

    <!-- Login and student sign-up share a card and switch without leaving the page. -->
    <main id="loginView" class="login-shell">
      <section class="login-card">
        <div class="brand-mark">
          <img
            src="assets/images/school-logo.png"
            alt="Northwestern University logo"
            onerror="this.hidden=true"
          />
          <span class="brand-fallback">NU</span>
        </div>
        <p class="eyebrow">NORTHWESTERN UNIVERSITY</p>
        <h1>C.I.H.R.M.</h1>
        <p class="muted">Hotel Reservation Management System</p>
        <div class="gold-line"></div>
        <h2 id="authHeading">Welcome back</h2>
        <p id="authDescription" class="muted">
          Sign in to your hotel operations training workspace.
        </p>

        <form id="loginForm">
          <label>
            Email address
            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              required
            />
          </label>
          <label>
            Password
            <div class="password-wrap">
              <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
              />
              <button type="button" id="togglePassword" class="text-button">
                Show
              </button>
            </div>
          </label>
          <button class="btn primary full" type="submit">
            Sign in to C.I.H.R.M.
          </button>
          <p id="loginError" class="error"></p>
        </form>

        <form id="signupForm" class="hidden">
          <label>
            Full name
            <input
              type="text"
              id="signupName"
              maxlength="150"
              autocomplete="name"
              required
            />
          </label>
          <label>
            Email address
            <input
              type="email"
              id="signupEmail"
              maxlength="190"
              autocomplete="email"
              placeholder="you@example.com"
              required
            />
          </label>
          <label>
            Password
            <input
              type="password"
              id="signupPassword"
              minlength="8"
              autocomplete="new-password"
              placeholder="At least 8 characters"
              required
            />
          </label>
          <label>
            Confirm password
            <input
              type="password"
              id="signupConfirmPassword"
              minlength="8"
              autocomplete="new-password"
              required
            />
          </label>
          <button class="btn primary full" type="submit">
            Create student account
          </button>
          <p id="signupError" class="error"></p>
        </form>

        <p class="tiny">
          <span id="authSwitchPrompt">New here?</span>
          <button type="button" id="authSwitch" class="auth-switch">
            Create a student account
          </button>
        </p>
        <p class="tiny">
          Educational simulation · No real payments are processed
        </p>
      </section>
    </main>

    <!-- Feature scripts render role-specific pages into the content section below. -->
    <div id="appView" class="app hidden">
      <aside class="sidebar" id="sidebar">
        <div class="side-brand">
          <div class="brand-mark small">
            <img
              src="assets/images/school-logo.png"
              alt="Northwestern University logo"
              onerror="this.hidden=true"
            />
            <span class="brand-fallback">NU</span>
          </div>
          <div>
            <b>C.I.H.R.M.</b>
            <small>Hotel Learning System</small>
          </div>
        </div>
        <nav id="navigation"></nav>
        <div class="side-bottom">
          <div id="sideUser"></div>
          <button id="logoutBtn" class="nav-link">
            ↪ <span>Log out</span>
          </button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <button id="menuBtn" class="icon-btn">☰</button>
          <div>
            <span class="eyebrow">HOSPITALITY MANAGEMENT</span>
            <h2 id="pageHeading">Dashboard</h2>
          </div>
          <div class="top-user">
            <span class="avatar" id="avatar">U</span>
            <div>
              <b id="topName">User</b>
              <small id="topRole">Role</small>
            </div>
          </div>
        </header>
        <section id="content" class="content"></section>
        <div id="toast" class="toast"></div>
      </main>
    </div>

    <!-- Load shared app code, feature handlers, then the session bootstrap. -->
    <script src="js/app.js"></script>
    <script src="js/operations.js"></script>
    <script src="js/reports.js"></script>
    <script src="js/hotel-services.js"></script>
    <script src="js/learning.js"></script>
    <script src="js/accounts.js"></script>
    <script src="js/init.js"></script>
  </body>
</html>
